<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>

   <h1>Password Generator</h1>

   <div id="inputContainer">
      <label>Enter the length of the password:</label>
      <input type="number" id="length">
   </div>

   <div id="optionsContainer">
      <input type="checkbox" id="lowercase" checked> Include lowercase characters
      <input type="checkbox" id="uppercase" checked> Include uppercase characters
      <input type="checkbox" id="numbers" checked> Include numbers
      <input type="checkbox" id="symbols" checked> Include symbols
   </div>

   <button onclick="handleGenerate()" id="generate">Generate</button>

   <div id="result"></div>

   <script src="index.js"></script>
</body>
</html>
